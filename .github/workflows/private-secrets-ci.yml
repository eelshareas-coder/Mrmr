name: Private Integrations & Secrets CI

on:
  workflow_dispatch:
    inputs:
      integration:
        description: "Integration to check"
        required: true
        type: choice
        options:
          - youtube
          - generic

# Manual only: never expose secrets to fork pull requests.
permissions:
  contents: read

jobs:
  private-integration-check:
    runs-on: ubuntu-latest
    environment: private-integrations
    steps:
      - name: Check configured secret presence without revealing values
        shell: bash
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          GENERIC_API_TOKEN: ${{ secrets.GENERIC_API_TOKEN }}
        run: |
          set -euo pipefail
          case "${{ inputs.integration }}" in
            youtube)
              missing=0
              for name in YOUTUBE_CLIENT_ID YOUTUBE_CLIENT_SECRET YOUTUBE_REFRESH_TOKEN; do
                if [[ -z "${!name:-}" ]]; then
                  echo "::error::Required secret is not configured: $name"
                  missing=1
                fi
              done
              if [[ "$missing" -ne 0 ]]; then
                echo "PRIVATE_INTEGRATION=NOT_CONFIGURED"
                exit 1
              fi
              echo "PRIVATE_INTEGRATION=CONFIGURED"
              ;;
            generic)
              if [[ -z "${GENERIC_API_TOKEN:-}" ]]; then
                echo "::error::Required secret is not configured: GENERIC_API_TOKEN"
                echo "PRIVATE_INTEGRATION=NOT_CONFIGURED"
                exit 1
              fi
              echo "PRIVATE_INTEGRATION=CONFIGURED"
              ;;
            *)
              echo "::error::Unsupported integration"
              exit 2
              ;;
          esac
          echo "SECRET_VALUES=NEVER_PRINTED"
          echo "NO_API_REQUESTS_MADE=true"
