uncertainty_notes:
  - "لا ينبغي تعميم أن الترجمة النصية غير كافية لكل شخص أو لكل فيديو؛ مدى الحاجة إلى وسائل إضافية يعتمد على المعلومات الموجودة في المحتوى."
  - "لا ينبغي تحويل إرشادات WCAG إلى نصيحة علاجية أو تقييم فردي."
  - "لا ينبغي الادعاء بأن وسيلة واحدة تحقق الإتاحة لكل الجمهور."
audience_framing:
  recommended: "الترجمة النصية خطوة أساسية، لكن الإتاحة قد تحتاج طبقات إضافية عندما يحمل الفيديو معلومات مهمة في الصورة لا ينقلها الصوت."
  avoid:
    - "الترجمة النصية لا تفيد."
    - "الترجمة النصية تجعل أي فيديو متاحًا للجميع."
    - "كل فيديو يحتاج نفس حزمة الإتاحة."
red_flag_review:
  status: PASS
  flags:
    - "Avoid universal claims."
    - "Keep captions distinct from audio description and descriptive transcripts."
    - "Do not present WCAG conformance as a medical or individualized recommendation."
verification_decision:
  decision: VERIFIED
  rationale: "All production claims have source mappings, authoritative source tiers are satisfied, uncertainty boundaries are recorded, and no production claim is unsupported."
