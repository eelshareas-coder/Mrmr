version: 1
topic_id: TQ-002
verification_package_id: VP-TQ-002-v1
question: "هل الترجمة النصية وحدها تجعل الفيديو متاحًا؟"
scope: "Prererecorded video accessibility, focusing on the relationship between captions and other ways of conveying important visual information."
audience:
  - "صناع المحتوى"
  - "المعلمون"
  - "الجمهور المهتم بالإتاحة"
evidence_card:
  summary: "Captions are an important accessibility layer because they convey speech and relevant non-speech audio information. They do not automatically communicate important visual information that is absent from the audio; depending on the media, audio description or a text-based alternative may be appropriate."
  evidence_strength: strong
  evidence_as_of: "2026-10-04"
  sensitivity_level: ordinary
